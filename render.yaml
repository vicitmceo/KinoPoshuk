databases:
  - name: kinoposhuk-db
    plan: free
    databaseName: kinoposhuk
    user: kinoposhuk

services:
  - type: web
    name: kinoposhuk-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kinoposhuk-db
          property: connectionString
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
